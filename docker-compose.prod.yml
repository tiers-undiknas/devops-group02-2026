name: uts-devops

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/tiers-undiknas/devops-group02-2026/ope-backend:1.0.1
    command: [ "npm", "start" ]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "3000:3000"
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/tiers-undiknas/devops-group02-2026/ope-backend:1.0.1
    command: [ "npm", "run", "start:worker" ]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f '[n]ode src/worker[.]js' > /dev/null" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/tiers-undiknas/devops-group02-2026/ope-frontend:1.0.1
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
