# pakai DNS internal docker supaya nama service "api" bisa ditemukan
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # lokasi file hasil build vite
    root /usr/share/nginx/html;
    index index.html;

    # alamat backend api (nama service di docker-compose)
    set $api_upstream http://api:3000;

    # teruskan request /api/ ke backend
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # teruskan request /healthz/ ke backend
    location /healthz/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # link metrics di halaman diagnostics
    location = /metrics {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # semua halaman lain diarahkan ke index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}