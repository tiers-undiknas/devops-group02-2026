name: CI Quality Pipeline (Lab 3 & Lab 4)

# Jalankan CI saat ada push atau pull request ke main
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ==========================================================
  # JOB 1: BACKEND LINTING, UNIT TEST, & INTEGRATION TEST
  # ==========================================================
  backend-ci:
    name: Backend Lint, Vitest, & Coverage Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies (Clean Install)
        run: npm ci

      - name: Run ESLint Static Code Analysis
        run: npx eslint src tests

      - name: Execute Vitest Unit & Integration Tests with Coverage
        run: npx vitest run --coverage

      - name: Enforce Code Coverage Quality Gate (Threshold >= 70%)
        id: coverage-gate
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const pct = summary.total.statements.pct;

            console.log('========================================================');
            console.log('Statement Code Coverage Aktual : ' + pct + '%');
            console.log('Ambang Batas Minimal (Quality Gate): 70.0%');
            console.log('========================================================');

            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'coverage_pct=' + pct + '\n');
            }

            if (pct < 70.0) {
              console.error('[QUALITY GATE FAILED] Coverage (' + pct + '%) di bawah ambang batas minimal 70.0%!');
              process.exit(1);
            }

            console.log('[QUALITY GATE PASSED] Cakupan kode memenuhi standar minimal (>= 70.0%).');
          "

      # Perbarui coverage.json di Gist setelah pemeriksaan backend di main berhasil
      - name: Update Coverage Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c417a22bd35409b7bdfa52c5c622c80b
          filename: coverage.json
          label: Code Coverage
          message: "${{ steps.coverage-gate.outputs.coverage_pct }}%"
          minColorRange: 70
          maxColorRange: 90
          valColorRange: ${{ steps.coverage-gate.outputs.coverage_pct }}

  # ==========================================================
  # JOB 2: FRONTEND LINTING, VITEST API TEST, & BUILD
  # ==========================================================
  frontend-ci:
    name: Frontend Test & Vite Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (Clean Install)
        run: npm ci

      - name: Run Frontend ESLint
        run: npx eslint src tests

      - name: Execute Frontend Vitest Tests with Coverage
        run: npx vitest run --coverage

      - name: Enforce Frontend Coverage Quality Gate (Threshold >= 70%)
        id: frontend-coverage-gate
        run: |
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const pct = summary.total.statements.pct;

            console.log('========================================================');
            console.log('[FRONTEND] Statement Code Coverage Aktual : ' + pct + '%');
            console.log('[FRONTEND] Ambang Batas Minimal (Quality Gate): 70.0%');
            console.log('========================================================');

            if (pct < 70.0) {
              console.error('[QUALITY GATE FAILED] Frontend coverage (' + pct + '%) di bawah ambang batas minimal 70.0%!');
              process.exit(1);
            }

            console.log('[QUALITY GATE PASSED] Frontend coverage memenuhi standar minimal (>= 70.0%).');
          "

      - name: Build Frontend for Production
        run: npm run build

  build-and-push-registry:
    name: Build and push container images
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate backend image tags
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/ope-backend
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ope-backend,enable=${{ github.ref_type == 'tag' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Check backend release tag
        if: github.ref_type == 'tag' && startsWith(steps.meta_backend.outputs.version, 'sha-')
        run: |
          echo "::error::Expected a semantic version tag such as v1.0.0."
          exit 1

      - name: Authenticate to Docker Hub for releases
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=ope-backend
          cache-to: type=gha,scope=ope-backend,mode=max

      - name: Generate frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tiers-undiknas/devops-group02-2026/ope-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
